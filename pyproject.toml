[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-voice-pipeline"
version = "0.2.0"
description = "Provider-neutral AI voice/TTS pipeline with a Gemini adapter"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
gemini = ["google-genai>=2.25.0,<3"]

[project.scripts]
ai-voice = "ai_voice_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
